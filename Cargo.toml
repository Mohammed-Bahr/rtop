[package]
name = "rtop"
version = "0.1.0"
edition = "2024"

description = "A modern Linux terminal system monitor written in Rust"
license = "MIT"

repository = "https://github.com/Mohammed-Bahr/rtop"
homepage = "https://github.com/Mohammed-Bahr/rtop"
readme = "README.md"

[dependencies]
ratatui = "0.24"
crossterm = "0.27"
sysinfo = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
